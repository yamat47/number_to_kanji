name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      # 一つの版の失敗で他の版を打ち切ると、どの版で通るのかが分からなくなる。
      fail-fast: false
      matrix:
        # EOL を迎えていないリリース版だけを並べる。https://www.ruby-lang.org/en/downloads/branches/
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
    - uses: actions/checkout@v2
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run the default task
      run: bundle exec rake
