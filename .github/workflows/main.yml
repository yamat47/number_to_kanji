name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      # 一つの版の失敗で他の版を打ち切ると、どの版で通るのかが分からなくなる。
      fail-fast: false
      matrix:
        # EOL を迎えていないリリース版だけを並べる。https://www.ruby-lang.org/en/downloads/branches/
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
    # github-toolkit は自分で管理しているリポジトリで、上流 action の SHA 固定と更新は toolkit 側で行う。
    # そのため @main を直接追いかける。toolkit の main の変更は、レビューを通さず次の CI からそのまま入る。
    - uses: yamat47/github-toolkit/actions/checkout@main
    - name: Set up Ruby
      uses: yamat47/github-toolkit/actions/setup-ruby@main
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run the default task
      run: bundle exec rake
