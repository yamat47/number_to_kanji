inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  EnabledByDefault: true

# MITなのでファイルの著作権は記載しない。
Style/Copyright:
  Enabled: false

# コメントを日本語で記述するのを許容する。
Style/AsciiComments:
  Enabled: false

# contextの記述を日本語で記述するのを許容する。
RSpec/ContextWording:
  Enabled: false

# 一つのテストで複数の内容を検証するのを許容する。
# ただし複数の振る舞いを検証するのは避ける。
RSpec/MultipleExpectations:
  Enabled: false

# elseがない場合にはcase文ではなくif文を許容する。
Style/MissingElse:
  EnforcedStyle: case

# 開発用の依存は gemspec の add_development_dependency に書く。
Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

# KANJI_MAP は数値をキーにした Hash で、[0] は先頭要素ではなくキー 0 の値を引く。
# この cop はレシーバが Array か判別できず、自動修正の first は [キー, 値] の組を返してしまう。
Style/ArrayFirstLast:
  Enabled: false
